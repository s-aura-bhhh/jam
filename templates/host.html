<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host | JAM</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <main class="container">
    <div id="view-setup" class="box">
      <h1>Host a JAM session</h1>
      <form id="setup-form" class="form-col">
        <label>Wrong pts <input type="number" id="wrong-points" value="-1" step="any" required></label>
        <label>Correct pts <input type="number" id="correct-points" value="3" step="any" required></label>
        <label>Timer (sec) <input type="number" id="timer-seconds" value="60" min="1" step="any" required></label>
        <button type="submit" class="btn primary huge">Create room</button>
      </form>
      <p id="setup-error" class="err-msg" hidden></p>
    </div>

    <div id="view-room" class="box" hidden>
      <header class="top-bar">
        <div class="code-wrap">
          <span>Room:</span>
          <strong id="room-code-display"></strong>
          <span id="game-number-host" class="badge">Game 1</span>
        </div>
        <div id="timer-display" class="clock">--.--</div>
        <div class="top-btns">
          <button id="reset-timer-btn" class="btn sm">Reset</button>
          <button id="disband-btn" class="btn sm danger">Disband</button>
        </div>
      </header>

      <p id="status-line" class="status"></p>

      <div class="main-actions">
        <button id="start-btn" class="btn primary huge" hidden>Start game</button>
        <button id="resume-btn" class="btn primary huge" hidden>Resume round</button>
        <button id="restart-btn" class="btn primary huge" hidden>Restart game</button>
      </div>

      <h2>Players</h2>
      <ul id="player-list" class="players"></ul>
    </div>
  </main>

  <div id="player-dialog" class="backdrop" hidden>
    <div class="modal">
      <button id="player-dialog-close" class="close-x">&times;</button>
      <h3 id="player-dialog-name"></h3>
      <div class="score-edit">
        <button id="player-score-minus" class="btn round">-</button>
        <span id="player-dialog-score" class="score-val">0</span>
        <button id="player-score-plus" class="btn round">+</button>
      </div>
      <button id="player-set-speaker" class="btn huge">Make speaker</button>
    </div>
  </div>

  <div id="decision-dialog" class="backdrop" hidden>
    <div class="modal">
      <h3 id="decision-dialog-title"></h3>
      <div class="flex-btns">
        <button id="decision-wrong-btn" class="btn danger huge">Wrong jam</button>
        <button id="decision-correct-btn" class="btn success huge">Correct jam</button>
      </div>
    </div>
  </div>

  <div id="letter-dialog" class="backdrop" hidden>
    <div class="modal">
      <h3>Reason?</h3>
      <div id="letter-grid" class="grid"></div>
      <div id="letter-other-row" class="other-row" hidden>
        <input type="text" id="letter-other-input" placeholder="Type reason...">
        <button id="letter-other-submit" class="btn">Submit</button>
      </div>
    </div>
  </div>

  <div id="ended-dialog" class="backdrop" hidden>
    <div class="modal">
      <h3 id="ended-winner-text"></h3>
      <button id="ended-close-btn" class="btn huge">Close</button>
    </div>
  </div>

  <div id="host-disbanded-dialog" class="backdrop" hidden>
    <div class="modal">
      <h3 class="red-title">Session Disbanded</h3>
      <p>Total Games: <strong id="host-total-games">0</strong></p>

      <table class="results">
        <thead>
          <tr>
            <th align="left">Player</th>
            <th>Wins</th>
            <th align="right">Score</th>
          </tr>
        </thead>
        <tbody id="host-overall-tbody">
        </tbody>
      </table>

      <a href="/" class="btn primary huge mt-2">Back to home</a>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
  </script>
  <script src="/static/js/host.js"></script>
</body>
</html>
